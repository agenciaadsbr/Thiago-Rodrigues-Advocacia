<style>
:root{
  --ink:#141414;--brass-light:#D0D0D0;--wa:#0E7A42;--wa-hover:#0B6536;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Hanken Grotesk","Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:min(90vw,720px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(208,208,208,.18);left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);animation:ring 3s var(--ease) forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(1)}}
.box{position:relative;max-width:480px;width:100%;text-align:center;animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.mark{width:88px;height:88px;margin:0 auto}
.mark img{width:100%;height:100%}
.brand{margin-top:26px;font-size:.9375rem;color:var(--brass-light);font-weight:500}
h1{margin:12px 0 0;font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.15;letter-spacing:-.01em}
p{margin:16px auto 0;color:rgba(255,255,255,.78);line-height:1.6;max-width:38ch}
.bar{margin:34px auto 0;height:3px;max-width:280px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--brass-light);animation:fill var(--wait,3000ms) linear forwards}
@keyframes fill{to{width:100%}}
.btn{margin-top:34px;display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;background:var(--wa);color:#fff;font-weight:600;font-size:1rem;text-decoration:none;transition:background-color .25s}
.btn:hover{background:var(--wa-hover)}
.btn svg{width:20px;height:20px}
.help{margin-top:18px;font-size:.875rem;color:rgba(255,255,255,.6)}
.help a{color:#fff}
:focus-visible{outline:2px solid var(--brass-light);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none !important}.bar span{width:100%}}
</style>

  espera: 3000                 /* ms antes de abrir o WhatsApp */
};

const params = new URLSearchParams(location.search);
const nomeCompleto = (params.get("nome") || "").trim().slice(0, 60);
const primeiro = nomeCompleto.split(/\s+/)[0] || "";
const primeiroFmt = primeiro ? primeiro.charAt(0).toUpperCase() + primeiro.slice(1).toLowerCase() : "";

if (primeiroFmt) document.getElementById("titulo").textContent = "Obrigado, " + primeiroFmt + ".";

const texto = nomeCompleto ? CONFIG.mensagem.replace("{nome}", nomeCompleto) : CONFIG.mensagemSemNome;
const url = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(texto);

document.getElementById("go").href = url;
document.getElementById("fallback").href = url;
document.documentElement.style.setProperty("--wait", CONFIG.espera + "ms");

window.dataLayer = window.dataLayer || [];
window.dataLayer.push({event: "redirect_whatsapp", utm_source: params.get("utm_source") || ""});

setTimeout(() => { window.location.replace(url); }, CONFIG.espera);
</script>
</body>
</html>
